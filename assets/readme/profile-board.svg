  <g transform="translate(60 513)">
    <rect width="1080" height="78" rx="22" fill="#0B1324" stroke="#253A58"/>
    <text x="30" y="31" fill="#7DD3FC" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" letter-spacing="2">DELIVERY LOOP</text>
    <g transform="translate(30 47)" fill="#D6E2F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19">
      <text x="0" y="0">Clarify scenario</text>
      <text x="182" y="0" fill="#67E8F9">→</text>
      <text x="216" y="0">Ship MVP</text>
      <text x="336" y="0" fill="#67E8F9">→</text>
      <text x="370" y="0">Observe feedback</text>
      <text x="570" y="0" fill="#67E8F9">→</text>
      <text x="604" y="0">Refine product</text>
      <text x="760" y="0" fill="#67E8F9">→</text>
      <text x="794" y="0">Automate the boring parts</text>
    </g>
    <rect x="30" y="61" width="1020" height="3" rx="1.5" fill="url(#loop-line)" opacity="0.7"/>
  </g>
</svg>
